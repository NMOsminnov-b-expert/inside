# «Осмотр» PWA в GitLab: сборка → образ в реестр GitLab → (по желанию) выкладка. Подробно — docs/devops-pwa.md.
#
# Переменные (Settings → CI/CD → Variables), все необязательные:
#   DEPLOY_HOST          — сервер для выкладки по ssh (нет — задачи deploy не появляются)
#   DEPLOY_USER          — пользователь на нём (по умолчанию deploy)
#   DEPLOY_SSH_KEY       — закрытый ключ ssh, тип «File», Protected + Masked
#   DEPLOY_DIR           — папка с docker-compose.yml на сервере (по умолчанию /opt/osmotr-pwa)
#   GRADLE_OPTS_EXTRA    — прокси/зеркала для Gradle, если раннер без прямого интернета (docs/devops-pwa.md)

stages: [build, image, deploy]

variables:
  PWA_DIST: shared/build/dist/wasmJs/productionExecutable
  IMAGE: $CI_REGISTRY_IMAGE/pwa

# --- 1. Сборка: Kotlin/Wasm → статические файлы (~10–20 мин без кэша, ~3–5 с кэшем; память — 6 ГБ) ---
build:pwa:
  stage: build
  image: eclipse-temurin:21-jdk-noble
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
    # Без демона: процесс задачи не переживает задачу.
    GRADLE_OPTS: "-Dorg.gradle.daemon=false $GRADLE_OPTS_EXTRA"
  cache:
    key:
      files: [gradle/libs.versions.toml, gradle/wrapper/gradle-wrapper.properties, kotlin-js-store/wasm/yarn.lock]
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/
  before_script:
    # nodejs — для генератора служебного работника (tools/web/sw.mjs); libatomic1 — Node.js, которого для webpack
    # качает Kotlin, без неё не запускается (код 127).
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs libatomic1 >/dev/null
  script:
    - tools/web/build.sh
    - test -f "$PWA_DIST/index.html" && test -f "$PWA_DIST/sw.js"
  artifacts:
    name: osmotr-pwa-$CI_COMMIT_SHORT_SHA
    paths: [shared/build/dist/wasmJs/productionExecutable/]
    expire_in: 2 weeks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- 2. Образ: nginx без root + собранное → $CI_REGISTRY_IMAGE/pwa:<коммит>, :latest (основная ветка), :<метка> ---
image:pwa:
  stage: image
  image: docker:29
  services: [docker:29-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [build:pwa]
  script:
    - cp -r "$PWA_DIST" pwa-dist
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker build -f deploy/pwa/Dockerfile.prebuilt -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    # Образ отвечает: файлы на месте, типы и заголовки те (как в tools/web/https-check.sh, без https).
    - docker run -d --name pwa-check "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - sleep 2
    - docker exec pwa-check wget -q -O /dev/null http://127.0.0.1:8080/healthz
    - docker exec pwa-check sh -c 'wget -q -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -qi "cache-control: no-cache"'
    - docker exec pwa-check sh -c 'f=$(ls /usr/share/nginx/html/*.wasm | head -n 1); wget -q -S -O /dev/null "http://127.0.0.1:8080/${f##*/}" 2>&1 | grep -qi "content-type: application/wasm"'
    - docker rm -f pwa-check
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest" && docker push "$IMAGE:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG" && docker push "$IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- 3. Выкладка на сервер с docker compose (Вариант A в docs/devops-pwa.md) — по кнопке ---
deploy:pwa:
  stage: deploy
  image: alpine:3.22
  needs: [image:pwa]
  environment:
    name: production
  before_script:
    - apk add -q --no-cache openssh-client
    - chmod 600 "$DEPLOY_SSH_KEY"
  script:
    - |
      ssh -i "$DEPLOY_SSH_KEY" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER:-deploy}@$DEPLOY_HOST" \
        "cd ${DEPLOY_DIR:-/opt/osmotr-pwa} \
         && echo '$CI_JOB_TOKEN' | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY \
         && cp -f .env .env.previous 2>/dev/null; printf 'OSMOTR_PWA_IMAGE=%s\n' '$IMAGE:$CI_COMMIT_SHORT_SHA' > .env \
         && docker compose pull && docker compose up -d \
         && docker logout $CI_REGISTRY"
  rules:
    - if: $DEPLOY_HOST && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $DEPLOY_HOST && $CI_COMMIT_TAG
      when: manual
