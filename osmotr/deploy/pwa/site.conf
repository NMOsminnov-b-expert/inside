# Пример сайта для nginx (/etc/nginx/sites-available/osmotr). Подставить домен, сертификат и папку.
server {
    listen 80;
    server_name osmotr.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name osmotr.example;
    ssl_certificate     /etc/letsencrypt/live/osmotr.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osmotr.example/privkey.pem;
    root /srv/osmotr;
    include /etc/nginx/osmotr-pwa.conf;
}
