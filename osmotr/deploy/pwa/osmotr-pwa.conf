# «Осмотр» PWA — общая часть сайта: типы, сжатие, кэш. Подключается в server { … } (см. site.conf);
# ею же проверяет tools/web/https-check.sh. Файлы — содержимое shared/build/dist/wasmJs/productionExecutable.

types {
    text/html                    html;
    text/css                     css;
    application/javascript       js;
    application/json             json map;
    application/wasm             wasm;
    application/manifest+json    webmanifest;
    image/png                    png;
    font/ttf                     ttf;
    text/plain                   txt;
}
default_type application/octet-stream;

gzip on;
gzip_comp_level 6;
gzip_types application/wasm application/javascript text/css application/json application/manifest+json font/ttf;

# Заголовки повторены в каждом location: add_header в location отменяет заданные уровнем выше.
# Безопасность: приложение ничего не грузит с чужих адресов; камера и микрофон — только себе.
# no-cache — без него телефоны не узнают о новой сборке (служебный работник сверяет sw.js при открытии).
# .wasm — имя по содержимому, меняется с каждой сборкой: кэш надолго.
location = / { try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always; add_header Strict-Transport-Security "max-age=31536000" always; }
location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always; add_header Strict-Transport-Security "max-age=31536000" always; }
location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always; add_header Strict-Transport-Security "max-age=31536000" always; }
location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always; add_header Strict-Transport-Security "max-age=31536000" always; }
location = /glue.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always; add_header Strict-Transport-Security "max-age=31536000" always; }
location = /osmotr.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always; add_header Strict-Transport-Security "max-age=31536000" always; }
location = /osmotr.css { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always; add_header Strict-Transport-Security "max-age=31536000" always; }
location ~ \.wasm$ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always; add_header Strict-Transport-Security "max-age=31536000" always; }
location ~ \.map$ { return 404; }
location / { try_files $uri =404; add_header Cache-Control "public, max-age=86400" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always; add_header Strict-Transport-Security "max-age=31536000" always; }
