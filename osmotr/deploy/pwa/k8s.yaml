# «Осмотр» PWA в Kubernetes (Вариант B в docs/devops-pwa.md). Подставить: образ, домен, секрет TLS, класс ingress.
#   kubectl apply -n osmotr -f deploy/pwa/k8s.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osmotr-pwa
  labels: { app: osmotr-pwa }
spec:
  replicas: 2
  selector:
    matchLabels: { app: osmotr-pwa }
  template:
    metadata:
      labels: { app: osmotr-pwa }
    spec:
      # Образ из закрытого реестра GitLab — секрет с deploy token (read_registry).
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: registry.example.com/group/osmotr/pwa:REPLACE_TAG
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 500m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          volumeMounts:
            # nginx пишет pid и временные файлы в /tmp — остальное только для чтения.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: osmotr-pwa
spec:
  selector: { app: osmotr-pwa }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: osmotr-pwa
  annotations:
    # Не сжимать повторно и не менять заголовки приложения — их ставит контейнер.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [osmotr.example.com]
      secretName: osmotr-pwa-tls
  rules:
    - host: osmotr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: osmotr-pwa
                port: { name: http }
