# «Осмотр» PWA на одном сервере: контейнер слушает только localhost:8080, https — nginx/балансировщик
# сервера перед ним (docs/devops-pwa.md, «Вариант A»). Образ — из реестра GitLab (задача image:pwa).
#   OSMOTR_PWA_IMAGE=registry.example/group/osmotr/pwa:<тег> docker compose -f deploy/pwa/docker-compose.yml up -d
services:
  osmotr-pwa:
    image: ${OSMOTR_PWA_IMAGE:-osmotr-pwa:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OSMOTR_PWA_PORT:-8080}:8080"
    # Данных у контейнера нет: всё приложения — в браузере телефона. Корень только для чтения.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.5
