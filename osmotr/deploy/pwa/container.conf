# nginx в контейнере «Осмотр» PWA: слушает 8080 без root (образ nginx-unprivileged), https снимает
# балансировщик/ingress перед ним. Общая часть (типы, сжатие, кэш, заголовки) — osmotr-pwa.conf.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    # Уже сжатое при сборке (.gz рядом с файлом) — без сжатия на каждый запрос.
    gzip_static on;
    # Проверка живости для оркестратора: без файлов и без журнала.
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    include /etc/nginx/osmotr-pwa.conf;
}
