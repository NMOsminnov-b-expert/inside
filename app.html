<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./app/kernel/tokens.css">
  <link rel="stylesheet" href="./app/kernel/motion.css">
  <link rel="stylesheet" href="./app/shell/shell.css">
  <!-- Оформление карточек ОЦ: одно на все типы (было пятью копиями). -->
  <link rel="stylesheet" href="./app/kernel/cards.css">
  <link rel="stylesheet" href="./app/kernel/ocParts.css">
  <link rel="stylesheet" href="./app/kernel/viewer.css">
  <link rel="stylesheet" href="./app/kernel/contacts.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="appSidebar">
      <div class="side-logo">
        <!-- Знак E•state: три полосы, складывающиеся в «E». Разметкой, а не
             картинкой: цвет берётся из токена, а при свёрнутом меню остаётся
             только знак. -->
        <svg class="logo-mark" viewBox="0 0 30 26" aria-hidden="true" focusable="false">
          <rect x="0" y="3.4" width="29" height="4.2" rx="2.1"/>
          <rect x="0" y="10.9" width="17" height="4.2" rx="2.1"/>
          <rect x="0" y="18.4" width="29" height="4.2" rx="2.1"/>
        </svg>

        <div class="logo-text">
          <b><span class="logo-dot" aria-hidden="true"></span><span class="logo-word">state</span></b>
          <span>Система оценки имущества</span>
        </div>
      </div>

      <!-- Меню по группам — как в рабочей системе (пользователь 23.11.2026: «макет вот в такой формат приведи… Проще будет на
           демонстрациях»; запись графа maket-v-format-rabochey-sistemy-…). Разделов, которых в макете нет, в меню нет. -->
      <nav class="side-nav">
        <div class="nav-group" aria-hidden="true"><span>Объекты оценки</span></div>
        <button class="nav-item" data-nav="oc-estate" title="Недвижимое — реестр объектов оценки: здания, квартиры, дома, участки">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg></span>
          <span class="nav-label">Недвижимое</span>
        </button>
        <button class="nav-item" data-nav="oc-vehicle" title="Транспорт — реестр транспортных средств">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3.5V16h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></span>
          <span class="nav-label">Транспорт</span>
        </button>
        <button class="nav-item" data-nav="oc-mech" title="Оборудование — реестр механизмов и оборудования">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
          <span class="nav-label">Оборудование</span>
        </button>
        <div class="nav-group" aria-hidden="true"><span>Осмотры</span></div>
        <button class="nav-item" data-nav="insp" title="Осмотры — панель региональных менеджеров: назначение осмотрщиков">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span>
          <span class="nav-label">Регионалы</span>
        </button>
        <button class="nav-item" data-nav="insp-field" title="Осмотры — экран выездных осмотрщиков">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 13 2 2 4-4"/></svg></span>
          <span class="nav-label">Осмотрщики</span>
        </button>
        <button class="nav-item" data-nav="scans" title="Сканы с осмотров — разбор документов, снятых осмотрщиками, и ответов кадастра">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 12h8"/></svg></span>
          <span class="nav-label">Сканы с осмотров</span>
          <span class="nav-count" data-nav-count="scans" hidden></span>
        </button>
        <div class="nav-group" aria-hidden="true"><span>Учреждения</span></div>
        <button class="nav-item" data-nav="inst" title="Учреждения">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9.5 12 4l9 5.5"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/></svg></span>
          <span class="nav-label">Учреждения</span>
        </button>
        <div class="nav-group" aria-hidden="true"><span>Содержимое</span></div>
        <button class="nav-item" data-nav="docs" title="Документы">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>
          <span class="nav-label">Документы</span>
        </button>
        <div class="nav-group" aria-hidden="true"><span>Обзор</span></div>
        <button class="nav-item" data-nav="analytics" title="Аналитика — земли по айыл аймакам: занятость участками с ЕНИ, земельный баланс, объекты в аймаках">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20h16"/><path d="M7 16v-4M12 16V7M17 16v-7"/></svg></span>
          <span class="nav-label">Аналитика</span>
        </button>
        <button class="nav-item" data-nav="archive" title="Архив документов" hidden>
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg></span>
          <span class="nav-label">Архив</span>
        </button>
        <div class="nav-group" aria-hidden="true"><span>Справочные данные</span></div>
        <button class="nav-item" data-nav="dict" title="Справочники — перечни значений для полей">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h11"/></svg></span>
          <span class="nav-label">Справочники</span>
        </button>
        <div class="nav-group" aria-hidden="true"><span>Администрирование</span></div>
        <button class="nav-item" data-nav="users" title="Пользователи">
          <span class="nav-ico"><svg class="nav-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 4.8a3.2 3.2 0 0 1 0 6.2M21 20c0-2.6-1.6-4.6-4-5.3"/></svg></span>
          <span class="nav-label">Пользователи</span>
          <span class="nav-soon">скоро</span>
        </button>
      </nav>

      <div class="side-foot">
        <span>v0.30.0</span>
        <span>Осминнов Н.</span>
      </div>

      <button class="sidebar-toggle" data-sidebar-toggle title="Свернуть меню">◀</button>
    </aside>

    <!-- Свёрнутое меню применяется ДО первой отрисовки.
         Разметка выше описывает меню раскрытым, а класс навешивает shell.js —
         но он модуль, а модули исполняются после разбора страницы: меню
         успевало отрисоваться в полную ширину и на глазах схлопывалось
         (замечание пользователя 09.09.2026).

         Поэтому здесь — единственный синхронный скрипт макета. Он читает тот
         же снимок, что kernel/persist.js, и ставит тот же класс, которым
         дальше управляет shell.js. Добавлять сюда что-либо ещё не нужно.

         ДЛЯ СЕРВЕРНОЙ ВЕРСИИ: на сервере личные настройки приходят вместе со
         страницей, и класс проставляет шаблон — этот скрипт не нужен. -->
    <script>
      try {
        var snap = JSON.parse(localStorage.getItem('inside:data:v1') || 'null');
        var shell = snap && snap.data && snap.data['ui.shell'];
        if (shell && shell.collapsed) {
          document.getElementById('appSidebar').classList.add('collapsed');
          // И стрелку кнопки: иначе она успевает мигнуть в другую сторону.
          var btn = document.querySelector('[data-sidebar-toggle]');
          if (btn) { btn.textContent = '▶'; btn.title = 'Развернуть меню'; }
        }
      } catch (e) { /* нет доступа к хранилищу — меню просто раскрыто */ }
    </script>

    <div class="main">
      <header class="topbar">
        <nav class="crumbs" id="crumbs"></nav>
        <!-- Меню пользователя: роль макета, «мои учреждения» и то, что добавит
             страница (у реестра — демо-объём). Наполняет shell.js. -->
        <div class="top-user dd" id="userMenu">
          <button class="top-user-btn" data-user-toggle aria-haspopup="true" aria-expanded="false" title="Роль и настройки макета">
            <span data-user-name>Осминнов Н.</span><span class="top-user-role" data-user-role></span><span class="avatar">ОН</span>
          </button>
          <div class="dd-menu user-menu" role="menu" aria-label="Меню пользователя" data-user-menu></div>
        </div>
      </header>

      <div class="main-row">
        <div class="content" id="content"></div>

        <aside class="notes-drawer hidden" id="notesDrawer">
          <button class="notes-tab" data-notes-toggle>
            <span>Заметки</span>
            <span class="pill-mini" id="drawerCount">0</span>
          </button>

          <div class="drawer-inner" id="drawerNotes"></div>
        </aside>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>

  <script type="module" src="./app/main.js"></script>
</body>
</html>
