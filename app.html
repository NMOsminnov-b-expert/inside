<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inside — Объекты оценки</title>

  <link rel="stylesheet" href="./app/kernel/tokens.css">
  <link rel="stylesheet" href="./app/shell/shell.css">
  <!-- Оформление карточек ОЦ: одно на все типы (было пятью копиями). -->
  <link rel="stylesheet" href="./app/kernel/cards.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="appSidebar">
      <div class="side-logo">
        <div class="logo-mark">I</div>

        <div class="logo-text">
          <b>Inside</b>
          <span>Система оценки имущества</span>
        </div>
      </div>

      <nav class="side-nav">
        <button class="nav-item" data-nav="inst" title="Учреждения">
          <span class="nav-ico">▤</span>
          <span class="nav-label">Учреждения</span>
        </button>

        <button class="nav-item active" data-nav="oc" title="Объекты оценки">
          <span class="nav-ico">▣</span>
          <span class="nav-label">Объекты оценки</span>
        </button>

        <button class="nav-item" data-nav="insp" title="Осмотры — задачи осмотрщика">
          <span class="nav-ico">▦</span>
          <span class="nav-label">Осмотры</span>
        </button>

        <button class="nav-item" data-nav="docs" title="Документы">
          <span class="nav-ico">◈</span>
          <span class="nav-label">Документы</span>
        </button>

        <button class="nav-item" data-nav="archive" title="Архив документов" hidden>
          <span class="nav-ico">⛁</span>
          <span class="nav-label">Архив</span>
        </button>

        <button class="nav-item" data-nav="dict" title="Справочники — перечни значений для полей">
          <span class="nav-ico">☰</span>
          <span class="nav-label">Справочники</span>
        </button>

        <button class="nav-item" data-nav="users" title="Пользователи">
          <span class="nav-ico">◎</span>
          <span class="nav-label">Пользователи</span>
          <span class="nav-soon">скоро</span>
        </button>
      </nav>

      <div class="side-foot">
        <span>v0.30.0</span>
        <span>Осминов Н.</span>
      </div>

      <button class="sidebar-toggle" data-sidebar-toggle title="Свернуть меню">◀</button>
    </aside>

    <!-- Свёрнутое меню применяется ДО первой отрисовки.
         Разметка выше описывает меню раскрытым, а класс навешивает shell.js —
         но он модуль, а модули исполняются после разбора страницы: меню
         успевало отрисоваться в полную ширину и на глазах схлопывалось
         (замечание пользователя 09.09.2026).

         Поэтому здесь — единственный синхронный скрипт макета. Он читает тот
         же снимок, что kernel/persist.js, и ставит тот же класс, которым
         дальше управляет shell.js. Добавлять сюда что-либо ещё не нужно.

         ДЛЯ СЕРВЕРНОЙ ВЕРСИИ: на сервере личные настройки приходят вместе со
         страницей, и класс проставляет шаблон — этот скрипт не нужен. -->
    <script>
      try {
        var snap = JSON.parse(localStorage.getItem('inside:data:v1') || 'null');
        var shell = snap && snap.data && snap.data['ui.shell'];
        if (shell && shell.collapsed) {
          document.getElementById('appSidebar').classList.add('collapsed');
          // И стрелку кнопки: иначе она успевает мигнуть в другую сторону.
          var btn = document.querySelector('[data-sidebar-toggle]');
          if (btn) { btn.textContent = '▶'; btn.title = 'Развернуть меню'; }
        }
      } catch (e) { /* нет доступа к хранилищу — меню просто раскрыто */ }
    </script>

    <div class="main">
      <header class="topbar">
        <nav class="crumbs" id="crumbs"></nav>
        <div class="top-user"><span>Осминов Н.</span><span class="avatar">ОН</span></div>
      </header>

      <div class="main-row">
        <div class="content" id="content"></div>

        <aside class="notes-drawer hidden" id="notesDrawer">
          <button class="notes-tab" data-notes-toggle>
            <span>Заметки</span>
            <span class="pill-mini" id="drawerCount">0</span>
          </button>

          <div class="drawer-inner" id="drawerNotes"></div>
        </aside>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script type="module" src="./app/main.js"></script>
</body>
</html>
